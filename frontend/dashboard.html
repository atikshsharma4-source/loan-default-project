<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LoanRisk | Dashboard</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- ================================
         Navigation Bar
    ================================= -->

    <header>

        <a class="brand" href="dashboard.html">
            ◆

            <span>
                LoanRisk
                <small>Risk Management System</small>
            </span>
        </a>


        <nav>

            <a
                class="active"
                href="dashboard.html"
            >
                Dashboard
            </a>


            <a href="saved-details.html">
                Saved Details
            </a>


            <button
                type="button"
                id="logout"
            >
                Logout
            </button>

        </nav>

    </header>


    <!-- ================================
         Main Content
    ================================= -->

    <main class="container">


        <!-- Page Heading -->

        <div class="heading">

            <div>

                <small class="eyebrow">
                    CREDIT ANALYSIS
                </small>


                <h1>
                    Loan Default Prediction
                </h1>


                <p>
                    Enter customer information to estimate default risk.
                </p>

            </div>


            <!-- Safety Threshold -->

            <div class="threshold">

                <span>Safety threshold</span>

                <b id="threshold">90%</b>

              <div class="threshold-control">

                <input
                   id="thresholdInput"
                   type="number"
                   min="0"
                   max="100"
                   step="1"
                   value="90"
                >

                <span>%</span>

                <button
                   type="button"
                   id="updateThreshold"
                >
                   Update
                </button>

              </div>

              <div id="thresholdMsg"></div>

            </div>

        
        
        </div>



        <!-- ================================
             Prediction Form
        ================================= -->

        <form
            id="predictionForm"
            class="panel"
        >

            <h2>
                Customer Information
            </h2>


            <div class="grid">


                <!-- Age -->

                <label>
                    Age

                    <input
                        id="Age"
                        type="number"
                        min="18"
                        max="110"
                        required
                    >
                </label>



                <!-- Gender -->

                <label>
                    Gender

                    <select
                        id="Gender"
                        required
                    >

                        <option value="">
                            Select
                        </option>

                        <option value="Female">
                            Female
                        </option>

                        <option value="Male">
                            Male
                        </option>

                    </select>

                </label>



                <!-- Person Income -->

                <label>
                    Person Income

                    <input
                        id="Person_Income"
                        type="number"
                        min="10000"
                        max="100000000"
                        required
                    >
                </label>



                <!-- Employee Experience -->

                <label>
                    Employee Experience

                    <input
                        id="Employee_Experience"
                        type="number"
                        min="0"
                        max="50"
                        required
                    >
                </label>



                <!-- Loan Amount -->

                <label>
                    Loan Amount

                    <input
                        id="Loan_Amount"
                        type="number"
                        min="1000"
                        max="10000000"
                        required
                    >
                </label>



                <!-- Loan Interest Rate -->

                <label>
                    Loan Interest Rate

                    <input
                        id="Loan_interest_Rate"
                        type="number"
                        min="1"
                        max="30"
                        step="0.01"
                        required
                    >
                </label>



                <!-- Loan Percentage -->

                <label>
                    Loan Percentage

                    <input
                        id="Loan_percentage"
                        type="number"
                        min="1"
                        max="100"
                        step="0.01"
                        required
                    >
                </label>



                <!-- Credit History -->

                <label>
                    Credit History

                    <input
                        id="Credit_History"
                        type="number"
                        min="0"
                        max="10"
                        step="0.1"
                        required
                    >
                </label>



                <!-- Credit Score -->

                <label>
                    Credit Score

                    <input
                        id="Credit_Score"
                        type="number"
                        min="200"
                        max="1000"
                        required
                    >
                </label>



                <!-- Previous Loan -->

                <label>
                    Previous Loan

                    <select
                        id="Previous_Loan"
                        required
                    >

                        <option value="">
                            Select
                        </option>

                        <option value="No">
                            No
                        </option>

                        <option value="Yes">
                            Yes
                        </option>

                    </select>

                </label>



                <!-- Education -->

                <label>
                    Education

                    <select
                        id="Education"
                        required
                    >

                        <option value="">
                            Select
                        </option>

                        <option value="Master">
                            Master
                        </option>

                        <option value="High School">
                            High School
                        </option>

                        <option value="Bachelor">
                            Bachelor
                        </option>

                        <option value="Associate">
                            Associate
                        </option>

                        <option value="Doctorate">
                            Doctorate
                        </option>

                    </select>

                </label>



                <!-- Home Ownership -->

                <label>
                    Home Ownership

                    <select
                        id="Home_Onwership"
                        required
                    >

                        <option value="">
                            Select
                        </option>

                        <option value="Rent">
                            Rent
                        </option>

                        <option value="Own">
                            Own
                        </option>

                        <option value="Mortgage">
                            Mortgage
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </label>



                <!-- Loan Intent -->

                <label>
                    Loan Intent

                    <select
                        id="Loan_Intent"
                        required
                    >

                        <option value="">
                            Select
                        </option>

                        <option value="Personal">
                            Personal
                        </option>

                        <option value="Education">
                            Education
                        </option>

                        <option value="Medical">
                            Medical
                        </option>

                        <option value="Venture">
                            Venture
                        </option>

                        <option value="Homeimprovement">
                            Home Improvement
                        </option>

                        <option value="Debtconsolidation">
                            Debt Consolidation
                        </option>

                    </select>

                </label>

            </div>



            <!-- ================================
                 Action Buttons
            ================================= -->

            <div class="action-buttons">

                <button
                    type="submit"
                >
                    Analyze Application →
                </button>


                <button
                    type="button"
                    id="saveButton"
                    class="save-button"
                    disabled
                >
                    Save Details
                </button>

            </div>



            <!-- Status / Error Message -->

            <div id="msg"></div>

        </form>



        <!-- ================================
             Prediction Result
        ================================= -->

        <section
            id="result"
            class="result hidden"
        >

            <small class="eyebrow">
                PREDICTION RESULT
            </small>


            <h2 id="decision">
                —
            </h2>


            <div class="metrics">


                <!-- Default Risk -->

                <div>

                    Default Risk

                    <strong id="risk">
                        —
                    </strong>

                </div>



                <!-- Safety Score -->

                <div>

                    Safety Score

                    <strong id="safety">
                        —
                    </strong>

                </div>



                <!-- Threshold -->

                <div>

                    Threshold

                    <strong id="resultThreshold">
                        —
                    </strong>

                </div>

            </div>

        </section>

    </main>



    <!-- Dashboard JavaScript -->

    <script src="js/dashboard.js"></script>

</body>

</html>
